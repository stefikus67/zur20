<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Porsche fundraiser TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sedgwick+Ave+Display&family=Unbounded:wght@500;700;800&display=swap">
<style>
  /* TV screen for the party: laptop -> HDMI -> 43" TV, read from 5 m.
     A fixed 1920x1080 stage, scaled to fit any screen (black letterbox), so sizes are real pixels on a 1080p TV.
     Same look as the invite: carbon stage, red floor light, the red 20 with spray-painted NEED MONEY FOR PORSCHE. */
  :root {
    --black: #000;
    --line: #232328;
    --ink: #f4f3f1;
    --muted: #a3a3aa;
    --red: #e0001b;
    --red-hot: #ff3a4c;
    --red-glow: 224, 0, 27;
    --disp: "Unbounded", "Arial Black", "Segoe UI", sans-serif;
    --spray: "Sedgwick Ave Display", "Impact", "Arial Black", sans-serif;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--black); color: var(--ink); overflow: hidden; }
  body { font-family: var(--ui); -webkit-font-smoothing: antialiased; }
  body.idle, body.idle * { cursor: none !important; }

  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px;
    transform-origin: 50% 50%; overflow: hidden; isolation: isolate; background: #000; }

  /* the room */
  .bg, .bg > * { position: absolute; inset: 0; pointer-events: none; }
  .bg .carbon { background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.022) 0 2px, transparent 2px 7px),
      linear-gradient(180deg, #121214 0%, #060606 55%, #000 100%); }
  .bg .spot { background: radial-gradient(45% 40% at 22% 0%, rgba(255,255,255,.09), transparent 70%); }
  .bg .floor { background: radial-gradient(60% 30% at 50% 104%, rgba(var(--red-glow), .55), rgba(var(--red-glow), .14) 45%, transparent 75%);
    animation: flicker 7s steps(1, end) infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 31% { opacity: .9; } 33% { opacity: 1; } 58% { opacity: .94; } 61% { opacity: 1; } 84% { opacity: .88; } 86% { opacity: 1; } }
  .bg .haze { inset: -20% -30%; background: radial-gradient(30% 30% at 30% 50%, rgba(var(--red-glow), .14), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate3d(-6%, 0, 0); } to { transform: translate3d(12%, -6%, 0); } }
  .bg .sweep { inset: -10% -60%; mix-blend-mode: screen;
    background: linear-gradient(105deg, transparent 40%, rgba(255,120,135,.16) 50%, transparent 60%);
    transform: translate3d(-60%, 0, 0); animation: sweep 11s cubic-bezier(.45,.05,.35,1) 2s infinite; z-index: 5; }
  @keyframes sweep { 0% { transform: translate3d(-60%, 0, 0); } 55%, 100% { transform: translate3d(60%, 0, 0); } }

  /* top bar */
  .top { position: absolute; left: 80px; right: 80px; top: 48px; display: flex; justify-content: space-between; align-items: center; z-index: 3; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: var(--disp); font-weight: 700; font-size: 36px; letter-spacing: .02em; }
  .brand i { width: 22px; height: 22px; border-radius: 50%; background: var(--red); box-shadow: 0 0 20px rgba(var(--red-glow), .95); display: block;
    animation: live 2.4s ease-in-out infinite; }
  @keyframes live { 50% { opacity: .45; } }
  .pill { font-family: var(--disp); font-weight: 500; font-size: 30px; color: var(--ink); background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 10px 28px; white-space: nowrap; }

  /* layout: main (bar) + side (top 5). Main fades/resizes when the leaderboard turns on. */
  .main { position: absolute; left: 0; top: 0; bottom: 0; width: 1920px; z-index: 2; transition: opacity .45s ease; }
  .side { position: absolute; top: 0; bottom: 0; right: 0; width: 576px; z-index: 2; padding: 150px 64px 120px 24px;
    transform: translateX(100%); opacity: 0; transition: transform .9s var(--ease), opacity .6s ease; }
  .stage.lb .main { width: 1344px; }
  .stage.lb .side { transform: none; opacity: 1; }
  .stage.swap .main { opacity: 0; }

  /* the mark: red 20 + spray paint */
  .mark { position: absolute; left: 90px; top: 170px; width: 660px; height: 500px; display: flex; align-items: center; justify-content: center; }
  .big20 { font-family: var(--disp); font-weight: 800; font-size: 400px; line-height: .78; letter-spacing: -.045em;
    background: linear-gradient(180deg, #ff4357 0%, #e0001b 42%, #a80014 78%, #7a000e 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--red);
    filter: drop-shadow(0 0 50px rgba(var(--red-glow), .45)) drop-shadow(0 26px 30px rgba(0,0,0,.6)); }
  .paint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-7deg); text-align: center; width: max-content;
    font-family: var(--spray); color: #fff; font-size: 112px; line-height: .92;
    text-shadow: 0 0 1px #fff, 0 0 8px rgba(255,255,255,.55), 0 0 26px rgba(255,255,255,.22), 3px 5px 0 rgba(0,0,0,.55), 0 0 40px rgba(0,0,0,.6); }
  .paint span { display: block; white-space: nowrap; }

  /* numbers */
  .nums { position: absolute; left: 820px; right: 80px; top: 180px; height: 480px; display: flex; flex-direction: column; justify-content: center; }
  .lbl { font-family: var(--disp); font-weight: 700; font-size: 40px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
  .amt { font-family: var(--disp); font-weight: 800; font-size: 210px; line-height: 1.02; letter-spacing: -.03em; white-space: nowrap;
    font-variant-numeric: tabular-nums; margin: 6px 0 4px; text-shadow: 0 0 40px rgba(var(--red-glow), .25); }
  .of { font-size: 54px; color: var(--muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .of b { color: var(--ink); font-weight: 700; }
  .car { font-size: 42px; color: var(--muted); margin-top: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .car b { color: var(--ink); font-weight: 600; }

  /* the bar */
  .barbox { position: absolute; left: 80px; right: 80px; top: 730px; }
  .bar { position: relative; height: 76px; border-radius: 99px; background: #1b1b20; box-shadow: inset 0 0 0 2px #2a2a31; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; min-width: 26px; border-radius: 99px;
    background: linear-gradient(180deg, #ff4357, #e0001b 55%, #b30016); overflow: hidden;
    box-shadow: 0 0 26px rgba(var(--red-glow), .95), 0 0 4px #fff; transition: width 2.6s var(--ease); animation: pulse 2.2s ease-in-out infinite; }
  .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.45) 50%, transparent 80%);
    transform: translateX(-100%); animation: shine 3.2s ease-in-out infinite; }
  @keyframes shine { 60%, 100% { transform: translateX(100%); } }
  @keyframes pulse { 50% { box-shadow: 0 0 46px rgba(var(--red-glow), 1), 0 0 4px #fff; } }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 40px; margin-top: 30px; }
  .left { font-family: var(--disp); font-weight: 800; font-size: 72px; color: var(--red-hot); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pct { font-family: var(--disp); font-weight: 700; font-size: 64px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* footer */
  .foot { position: absolute; left: 80px; right: 80px; bottom: 44px; display: flex; justify-content: space-between; align-items: baseline; gap: 40px; z-index: 3; }
  .note { font-size: 40px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .upd { font-size: 32px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .upd.off::after { content: " · brez povezave"; color: var(--red-hot); }

  /* leaderboard layout: tighter main column */
  .stage.lb .mark { left: 40px; top: 190px; width: 470px; height: 440px; }
  .stage.lb .big20 { font-size: 290px; }
  .stage.lb .paint { font-size: 78px; }
  .stage.lb .nums { left: 540px; right: 40px; }
  .stage.lb .amt { font-size: 170px; }
  .stage.lb .of { font-size: 46px; }
  .stage.lb .car { font-size: 38px; }
  .stage.lb .barbox { left: 80px; right: 40px; }
  .stage.lb .left { font-size: 60px; }
  .stage.lb .pct { font-size: 56px; }

  /* top 5 */
  .panel { height: 100%; border-radius: 28px; border: 2px solid var(--line); padding: 40px 40px 30px;
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015)); display: flex; flex-direction: column; }
  .panel h2 { margin: 0 0 22px; font-family: var(--spray); font-weight: 400; font-size: 92px; line-height: 1; color: #fff; transform: rotate(-3deg); transform-origin: left;
    text-shadow: 0 0 8px rgba(255,255,255,.45), 3px 4px 0 rgba(0,0,0,.55); }
  .tops { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; justify-content: flex-start; gap: 6px; }
  .tops li { display: grid; grid-template-columns: 76px 1fr; column-gap: 24px; align-items: center; padding: 16px 0; border-top: 2px solid var(--line);
    animation: rowin .8s var(--ease) both; }
  .tops li:first-child { border-top: 0; }
  @keyframes rowin { from { opacity: 0; transform: translateX(40px); } }
  .rk { width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--disp); font-weight: 800; font-size: 36px;
    background: #16161a; color: var(--ink); box-shadow: inset 0 0 0 3px var(--red); }
  .rk.r1 { background: var(--red); color: #fff; box-shadow: 0 0 26px rgba(var(--red-glow), .8); }
  .rk.r2, .rk.r3 { background: #2a0a0e; }
  .nm { font-size: 44px; font-weight: 700; line-height: 1.12; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .am { font-family: var(--disp); font-size: 38px; font-weight: 700; color: var(--red-hot); line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { font-size: 40px; color: var(--muted); margin: 10px 0 0; }

  .hint { position: absolute; left: 50%; top: 128px; transform: translateX(-50%); z-index: 6; font-size: 30px; color: var(--ink);
    background: rgba(0,0,0,.75); border: 2px solid var(--line); border-radius: 999px; padding: 14px 34px; transition: opacity .6s; white-space: nowrap; }
  .hint.gone { opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .bg .floor, .bg .haze, .bg .sweep, .brand i, .fill, .fill::after, .tops li { animation: none !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" aria-hidden="true"><div class="carbon"></div><div class="spot"></div><div class="haze"></div><div class="floor"></div><div class="sweep"></div></div>

  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Fundraiser</div>
    <span class="pill">Pomagaj Stepanu do Porscheja</span>
  </header>

  <div class="main" id="main">
    <div class="mark" aria-hidden="true">
      <div class="big20">20</div>
      <div class="paint"><span>NEED MONEY</span><span>FOR PORSCHE</span></div>
    </div>

    <div class="nums">
      <div class="lbl">Zbrano</div>
      <div class="amt" id="amt">0 €</div>
      <div class="of">od <b id="goal">287.430 €</b></div>
      <div class="car">Cilj: <b id="car">Porsche 911 GT3 RS</b></div>
    </div>

    <div class="barbox">
      <div class="bar" role="progressbar" aria-label="Zbrano" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><div class="fill" id="fill"></div></div>
      <div class="row"><span class="left" id="left">Manjka 287.430 €</span><span class="pct" id="pct">0 %</span></div>
    </div>
  </div>

  <aside class="side" id="side" aria-label="Top 5 donatorjev">
    <div class="panel">
      <h2>Top 5</h2>
      <ol class="tops" id="tops"></ol>
    </div>
  </aside>

  <footer class="foot">
    <span class="note" id="note"></span>
    <span class="upd" id="upd">posodobljeno –</span>
  </footer>

  <div class="hint" id="hint">Klik ali F11 = cel zaslon</div>
</div>

<script>
(function () {
  'use strict';
  var REFRESH_MS = 60000;
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage');

  // ---------- fit the 1920x1080 stage to any screen ----------
  function fitStage() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  // ---------- formatting (same as the invite) ----------
  function eur(n) {
    n = Number(n); if (!isFinite(n) || n < 0) n = 0; n = Math.min(n, 999999999999);
    var whole = Math.floor(n), cents = Math.round((n - whole) * 100);
    if (cents === 100) { whole += 1; cents = 0; }
    var s = String(whole).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return s + (cents ? ',' + (cents < 10 ? '0' : '') + cents : '') + ' €';
  }
  function pctText(p) {
    if (p >= 100) return '100 %';
    var d = p < 1 ? 2 : 1;
    return p.toFixed(d).replace('.', ',') + ' %';
  }
  function hhmm(d) {
    try {
      return d.toLocaleTimeString('sl-SI', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Europe/Ljubljana' });
    } catch (e) {
      var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return p(d.getHours()) + ':' + p(d.getMinutes());
    }
  }

  // shrink a line until it fits its box (stage is fixed px, so this is stable)
  function fit(el, max, box) {
    el.style.fontSize = max + 'px';
    var size = max;
    while (el.scrollWidth > box && size > 30) { size -= 4; el.style.fontSize = size + 'px'; }
  }
  function fitAll() {
    var lb = stage.classList.contains('lb');
    fit($('amt'), lb ? 170 : 210, $('amt').parentNode.clientWidth);
    fit($('left'), lb ? 60 : 72, $('left').parentNode.clientWidth - $('pct').offsetWidth - 40);
  }

  // ---------- animated numbers ----------
  var shown = { g: 0, goal: 287430 };
  var anim = null;
  function render(g, goal) {
    $('amt').textContent = eur(g);
    $('left').textContent = g >= goal ? 'Cilj dosežen. Res?' : 'Manjka ' + eur(goal - g);
    var p = Math.min(100, g / goal * 100);
    $('pct').textContent = pctText(p);
  }
  function tweenTo(g, goal) {
    var from = shown.g, start = null, dur = 2600;
    shown.goal = goal;
    if (anim) cancelAnimationFrame(anim);
    var calm = false; try { calm = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (calm || document.hidden || !window.requestAnimationFrame || from === g) {
      shown.g = g; render(g, goal); fitAll(); return;
    }
    var step = function (ts) {
      if (start === null) start = ts;
      var k = Math.min(1, (ts - start) / dur), e = 1 - Math.pow(1 - k, 3);
      var v = k >= 1 ? g : Math.round((from + (g - from) * e) * 100) / 100;
      render(v, goal);
      if (k < 1) anim = requestAnimationFrame(step); else { anim = null; fitAll(); }
    };
    shown.g = g;
    render(Math.max(from, g), goal); fitAll();   // fit for the widest value first, so the line never jumps out of its box
    anim = requestAnimationFrame(step);
    setTimeout(function () { if (anim) { cancelAnimationFrame(anim); anim = null; } render(g, goal); fitAll(); }, dur + 600);
  }

  // ---------- top 5 ----------
  var lastTops = '';
  function renderTops(list) {
    var rows = (Array.isArray(list) ? list : [])
      .filter(function (r) { return r && typeof r.name === 'string' && r.name.trim() && isFinite(Number(r.amount)) && Number(r.amount) > 0; })
      .map(function (r, i) { return { name: Array.from(r.name.trim()).slice(0, 32).join(''), amount: Number(r.amount), i: i }; })
      .sort(function (a, b) { return (b.amount - a.amount) || (a.i - b.i); })
      .slice(0, 5);
    var key = JSON.stringify(rows);
    if (key === lastTops) return;
    lastTops = key;
    var ol = $('tops');
    while (ol.firstChild) ol.removeChild(ol.firstChild);
    if (!rows.length) {
      var e = document.createElement('li'); e.className = 'empty'; e.textContent = 'Prvi donator je lahko ti.'; ol.appendChild(e); return;
    }
    rows.forEach(function (r, i) {
      var li = document.createElement('li'); li.style.animationDelay = (i * 0.12) + 's';
      var rk = document.createElement('span'); rk.className = 'rk' + (i < 3 ? ' r' + (i + 1) : ''); rk.textContent = String(i + 1);
      var tx = document.createElement('span'); tx.style.minWidth = '0';
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = r.name;
      var am = document.createElement('div'); am.className = 'am'; am.textContent = eur(r.amount);
      tx.appendChild(nm); tx.appendChild(am); li.appendChild(rk); li.appendChild(tx); ol.appendChild(li);
    });
  }

  // ---------- layout ----------
  var forced = null;
  try { var q = new URLSearchParams(location.search).get('layout'); if (q === 'lb') forced = true; else if (q === 'bar') forced = false; } catch (e) {}
  var lbOn = null;
  function setLayout(on) {
    if (forced !== null) on = forced;
    if (on === lbOn) return;
    var first = lbOn === null;
    lbOn = on;
    if (first) { stage.classList.toggle('lb', on); fitAll(); return; }
    stage.classList.add('swap');
    setTimeout(function () {
      stage.classList.toggle('lb', on); fitAll();
      requestAnimationFrame(function () { stage.classList.remove('swap'); });
    }, 460);
  }

  // ---------- data ----------
  var pageRev = null, lastUpdated = null;
  function apply(j) {
    var g = Number(j.gathered), goal = Number(j.goal);
    if (!isFinite(g) || g < 0) throw new Error('bad gathered');
    if (!isFinite(goal) || goal <= 0) goal = shown.goal || 287430;
    g = Math.min(g, 999999999999); goal = Math.min(goal, 999999999999);

    if (j.page_rev != null) {
      if (pageRev === null) pageRev = String(j.page_rev);
      else if (String(j.page_rev) !== pageRev) { location.reload(); return; }   // Claude pushed a new tv.html: pick it up
    }

    $('goal').textContent = eur(goal);
    if (typeof j.car === 'string' && j.car.trim()) $('car').textContent = j.car.trim();
    var p = Math.min(100, g / goal * 100);
    $('fill').style.width = p.toFixed(4) + '%';
    $('barWrap').setAttribute('aria-valuenow', p.toFixed(4));
    tweenTo(g, goal);
    renderTops(j.top5);
    $('note').textContent = typeof j.note === 'string' ? j.note : '';
    setLayout(j.leaderboard_on === true);

    var d = j.updated_at ? new Date(j.updated_at) : null;
    lastUpdated = (d && !isNaN(d.getTime())) ? d : new Date();
    $('upd').textContent = 'posodobljeno ' + hhmm(lastUpdated);
  }

  function load() {
    var ctl = window.AbortController ? new AbortController() : null;
    var to = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
    return fetch('tv.json?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) { clearTimeout(to); apply(j); $('upd').classList.remove('off'); })
      .catch(function () { clearTimeout(to); $('upd').classList.add('off'); });   // keep the last good numbers on screen
  }

  // start: bar from zero, then the real numbers
  render(0, shown.goal);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  setTimeout(load, 400);
  setInterval(load, REFRESH_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { load(); lockScreen(); } });

  // ---------- TV comforts: fullscreen on click, hidden cursor, screen stays awake ----------
  var hint = $('hint');
  function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement) || (window.innerHeight >= screen.height - 2 && window.innerWidth >= screen.width - 2); }
  function hintCheck() { hint.classList.toggle('gone', isFull()); }
  setTimeout(function () { hint.classList.add('gone'); }, 12000);
  window.addEventListener('resize', hintCheck);
  document.addEventListener('click', function () {
    var el = document.documentElement;
    try {
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
      else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    } catch (e) {}
  });
  var idleT = null;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 3000); }
  document.addEventListener('mousemove', wake); wake();

  var lock = null;
  function lockScreen() {
    try {
      if (!('wakeLock' in navigator) || document.hidden || lock) return;
      navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }).catch(function () {});
    } catch (e) {}
  }
  lockScreen();
  document.addEventListener('click', lockScreen);
})();
</script>
</body>
</html>
